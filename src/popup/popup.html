<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Sound Controller & EQ</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <header>
        <div class="head">
            <img class="head__icon" src="../../assets/icon/icon-256.png" alt="Sound Controller & EQ">
            <h1 class="head__name">Sound Controller ~ EQ</h1>
            <button id="theme" class="icon-btn" type="button" aria-label="Switch light or dark mode">
                <svg class="theme-sun" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round">
                    <circle cx="12" cy="12" r="5" stroke="none"></circle>
                    <path
                        d="M12 1v3M12 20v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M1 12h3M20 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1">
                    </path>
                </svg>
                <svg class="theme-moon" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path>
                </svg>
            </button>
            <button id="gear" class="icon-btn" type="button" aria-label="Settings" aria-expanded="false">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path fill-rule="evenodd" clip-rule="evenodd"
                        d="M12.7848 0.449982C13.8239 0.449982 14.7167 1.16546 14.9122 2.15495L14.9991 2.59495C15.3408 4.32442 17.1859 5.35722 18.9016 4.7794L19.3383 4.63233C20.3199 4.30175 21.4054 4.69358 21.9249 5.56605L22.7097 6.88386C23.2293 7.75636 23.0365 8.86366 22.2504 9.52253L21.9008 9.81555C20.5267 10.9672 20.5267 13.0328 21.9008 14.1844L22.2504 14.4774C23.0365 15.1363 23.2293 16.2436 22.7097 17.1161L21.925 18.4339C21.4054 19.3064 20.3199 19.6982 19.3382 19.3676L18.9017 19.2205C17.1859 18.6426 15.3408 19.6754 14.9991 21.405L14.9122 21.845C14.7167 22.8345 13.8239 23.55 12.7848 23.55H11.2152C10.1761 23.55 9.28331 22.8345 9.08781 21.8451L9.00082 21.4048C8.65909 19.6754 6.81395 18.6426 5.09822 19.2205L4.66179 19.3675C3.68016 19.6982 2.59465 19.3063 2.07505 18.4338L1.2903 17.1161C0.770719 16.2436 0.963446 15.1363 1.74956 14.4774L2.09922 14.1844C3.47324 13.0327 3.47324 10.9672 2.09922 9.8156L1.74956 9.52254C0.963446 8.86366 0.77072 7.75638 1.2903 6.8839L2.07508 5.56608C2.59466 4.69359 3.68014 4.30176 4.66176 4.63236L5.09831 4.77939C6.81401 5.35722 8.65909 4.32449 9.00082 2.59506L9.0878 2.15487C9.28331 1.16542 10.176 0.449982 11.2152 0.449982H12.7848ZM12 15.3C13.8225 15.3 15.3 13.8225 15.3 12C15.3 10.1774 13.8225 8.69998 12 8.69998C10.1774 8.69998 8.69997 10.1774 8.69997 12C8.69997 13.8225 10.1774 15.3 12 15.3Z">
                    </path>
                </svg>
            </button>
        </div>
        <p class="head__desc">Boost or cut volume for each tab, up to 600%.</p>
    </header>

    <div id="settings" class="collapse">
        <div class="collapse__inner">
            <section class="card">
                <h2 class="card__title">Settings</h2>
                <div class="setting">
                    <span>Settings file</span>
                    <div class="setting__btns">
                        <button id="exportBtn" class="btn" type="button">Export</button>
                        <button id="importBtn" class="btn" type="button">Import</button>
                        <input id="importFile" type="file" accept=".json,application/json" hidden>
                    </div>
                </div>
                <label class="check"><input id="importReplace" type="checkbox"> Replace all instead of merge</label>
                <button id="undoImport" class="btn" type="button" hidden>Undo last import</button>
                <p id="settingsMsg" class="msg" role="status"></p>
            </section>
        </div>
    </div>

    <div id="controls">
        <section class="card" id="master">
            <div class="target"><img id="targetIcon" width="14" height="14" alt=""><span id="targetName"></span></div>
            <div class="vol">
                <button id="volDown" class="step-btn" type="button" aria-label="Volume down">-</button>
                <input id="volRange" class="slider" type="range" aria-label="Volume">
                <button id="volUp" class="step-btn" type="button" aria-label="Volume up">+</button>
            </div>
            <div id="readout" class="readout">
                <span>Volume: </span>
                <span id="volText">100</span>
                <small>%</small>
            </div>
            <div class="actions">
                <button id="volReset" class="btn" type="button">Default (100)</button>
                <div class="switch-wrap">
                    <span>Auto restore</span>
                    <button id="restoreSwitch" class="switch" type="button" role="switch" aria-checked="true"
                        aria-label="Auto restore volume"></button>
                </div>
            </div>
            <p id="volMsg" class="msg" role="status"></p>
        </section>

        <section class="card eq">
            <button id="eqToggle" class="eq__head" type="button" aria-expanded="false"><span>EQ</span><span
                    class="chev"></span></button>
            <div id="eqBody" class="collapse">
                <div class="collapse__inner">
                    <div class="eq__pad">
                        <div id="eqPresets" class="chips"></div>
                        <div id="eqBands" class="bands"></div>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <section>
        <h2 class="sec-title">Have Auido Now</h2>
        <p id="listMsg" class="msg" role="status"></p>
        <p id="empty" class="empty">No tab playing audio</p>
        <ul id="list" class="list"></ul>
    </section>

    <script type="module" src="popup.js"></script>
</body>

</html>
